{% extends "base.html" %}
{% block title %}Create account · SecureAuth{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">GET STARTED</span>
    <h1>Create your account</h1>
    <p class="muted">Fill in the details below to register.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username</label>
      <input name="username" minlength="3" maxlength="30" required autocomplete="username" placeholder="Choose a username">
      <label>Email address</label>
      <input type="email" name="email" maxlength="254" required autocomplete="email" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" name="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
      <label>Confirm password</label>
      <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password" placeholder="Enter password again">
      <button class="button primary full" type="submit">Create account</button>
    </form>
    <p class="form-bottom">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
